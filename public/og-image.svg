<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main content -->
  <g>
    <!-- Title -->
    <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
      Modern Mermaid Editor
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)" text-anchor="middle">
      A modern, powerful, and beautiful Mermaid.js diagram editor
    </text>
    
    <!-- Features -->
    <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">
      Professional Themes • Advanced Export • Annotation Tools • Live Preview
    </text>
    
    <!-- Icon -->
    <g transform="translate(520, 450)">
      <circle cx="80" cy="40" r="80" fill="rgba(255,255,255,0.1)"/>
      <g transform="translate(80, 40) scale(3.5)">
        <path d="M0 -10V-3M0 -3H-10V5M0 -3H10V5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect class="logo-node" x="-5" y="-15" width="10" height="8" rx="2" fill="white"/>
        <rect class="logo-node" x="-15" y="5" width="10" height="9" rx="2" fill="white"/>
        <rect class="logo-node" x="5" y="5" width="10" height="9" rx="2" fill="white"/>
        <circle cx="0" cy="-11" r="1.5" fill="#6d5dfc"/>
        <circle cx="-10" cy="9.5" r="1.5" fill="#6d5dfc"/>
        <circle cx="10" cy="9.5" r="1.5" fill="#6d5dfc"/>
      </g>
    </g>
  </g>
</svg>

